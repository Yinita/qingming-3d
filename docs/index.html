<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>入卷 · 文档</title>
<style>
  :root { --paper:#EDE6D6; --paper-2:#F6F0E3; --ink:#2A2620; --muted:#6B6152; --line:#CDBFA4; --seal:#843B30;
    --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.8 var(--serif); }
  a { color:var(--seal); }
  header { position:sticky; top:0; z-index:2; background:rgba(237,230,214,.95); border-bottom:1px solid var(--line); }
  header .wrap { display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; padding-top:10px; padding-bottom:10px; }
  header .brand { font-weight:700; letter-spacing:.16em; text-decoration:none; color:var(--ink); margin-right:auto; }
  header nav a { font-size:14px; margin-left:12px; text-decoration:none; color:var(--ink); }
  header nav a[aria-current=page] { color:var(--seal); font-weight:700; }
  .wrap { max-width:960px; margin:0 auto; padding:0 16px; }
  main { padding:24px 16px 64px; }
  main h1, main h2, main h3, main h4 { scroll-margin-top:64px; }
  main h1 { font-size:30px; line-height:1.3; margin:8px 0 16px; letter-spacing:.04em; }
  main h2 { font-size:22px; margin:36px 0 10px; padding-top:10px; border-top:1px solid var(--line); }
  main h3 { font-size:18px; margin:24px 0 8px; }
  main table { display:block; overflow-x:auto; border-collapse:collapse; margin:12px 0 18px; font-size:14.5px; line-height:1.6; }
  main th, main td { border:1px solid var(--line); padding:7px 9px; vertical-align:top; text-align:left; min-width:88px; }
  main th { background:var(--paper-2); white-space:nowrap; }
  main code { font-family:ui-monospace,"SFMono-Regular",Menlo,monospace; font-size:.88em; background:var(--paper-2);
    padding:1px 4px; border-radius:3px; }
  main pre { background:var(--paper-2); border:1px solid var(--line); border-radius:4px; padding:12px 14px; overflow-x:auto; line-height:1.5; }
  main pre code { background:none; padding:0; }
  main img { max-width:100%; height:auto; }
  main blockquote { margin:12px 0; padding:4px 14px; border-left:3px solid var(--line); color:var(--muted); }
  main details { background:var(--paper-2); border:1px solid var(--line); border-radius:4px; padding:8px 12px; }
  .note { color:var(--muted); font-size:14px; }
  .source { margin-top:40px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="../">入卷</a>
    <nav id="nav">
      <a href="?f=quest-design.md">任务</a>
      <a href="?f=character-modeling.md">人物</a>
      <a href="../viewer/?mission">试玩</a>
    </nav>
  </div>
</header>
<main class="wrap" id="doc"><p class="note">正在载入文档……</p></main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const requested = params.get("f") || "quest-design.md";
  const doc = document.getElementById("doc");
  // Only relative markdown paths inside this site; no schemes, no leading slash.
  const safe = /^(\.\.\/)?[\w\-./]+\.md$/.test(requested) && !requested.includes("://") && !/(^|\/)\.\.\/\.\./.test(requested);
  if (!safe) { doc.innerHTML = '<p class="note">无法打开这个文档路径。</p>'; return; }

  const base = new URL(requested, location.href);          // URL of the markdown file
  const docsRoot = new URL("./", location.href);            // .../docs/
  function readerLink(target) {
    // Express a markdown URL relative to docs/ so it can go into ?f=.
    const rel = target.pathname.startsWith(docsRoot.pathname)
      ? target.pathname.slice(docsRoot.pathname.length)
      : "../" + target.pathname.slice(new URL("../", docsRoot).pathname.length);
    return "?f=" + rel + target.hash;
  }
  function slug(text) {
    return text.trim().toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, "").replace(/\s/g, "-");
  }

  for (const a of document.querySelectorAll("#nav a")) {
    if (a.getAttribute("href") === "?f=" + requested) a.setAttribute("aria-current", "page");
  }

  fetch(base).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(text => {
    doc.innerHTML = marked.parse(text, { gfm: true });
    const seen = new Map();
    for (const h of doc.querySelectorAll("h1,h2,h3,h4")) {
      let id = slug(h.textContent);
      const n = seen.get(id) || 0;
      seen.set(id, n + 1);
      if (n) id += "-" + n;
      h.id = id;
    }
    for (const a of doc.querySelectorAll("a[href]")) {
      const href = a.getAttribute("href");
      if (/^[a-z]+:/i.test(href) || href.startsWith("#")) {
        if (/^https?:/i.test(href)) { a.target = "_blank"; a.rel = "noopener"; }
        continue;
      }
      const target = new URL(href, base);
      if (/\.md$/i.test(target.pathname)) a.href = readerLink(target);
      else a.href = target.href;
    }
    for (const img of doc.querySelectorAll("img[src]")) {
      const src = img.getAttribute("src");
      if (!/^[a-z]+:/i.test(src)) img.src = new URL(src, base).href;
      img.loading = "lazy";
    }
    const title = doc.querySelector("h1");
    if (title) document.title = title.textContent + " · 入卷";
    const source = document.createElement("p");
    source.className = "source";
    const repoPath = decodeURIComponent(base.pathname.slice(new URL("../", docsRoot).pathname.length));
    source.innerHTML = '源文件：<a href="https://github.com/Yinita/qingming-3d/blob/main/' + repoPath + '">' + repoPath + '</a>';
    doc.appendChild(source);
    if (location.hash) {
      const el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (el) el.scrollIntoView();
    }
  }).catch(() => {
    doc.innerHTML = '<p class="note">文档载入失败。可以在 <a href="https://github.com/Yinita/qingming-3d/tree/main/docs">GitHub</a> 上阅读。</p>';
  });
})();
</script>
</body>
</html>
