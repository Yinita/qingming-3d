<section id="scene-loading" class="loading-panel" aria-labelledby="scene-loading-title">
  <div class="loading-sheet">
    <h2 id="scene-loading-title">正在展开画卷</h2>
    <p class="loading-note">先准备可以游览的画面，远处房屋随后加载。</p>
    <progress aria-label="首屏下载进度" max="100"></progress>
    <div class="loading-status"><span class="loading-metrics">正在连接服务器</span><span class="loading-elapsed">正在测算剩余时间</span></div>
    <button type="button" hidden>重新加载</button>
  </div>
</section>
<aside id="scene-background" class="loading-panel" aria-label="后台资源下载" hidden>
  <p>后台加载街景细节</p>
  <progress aria-label="街景素材下载进度" max="100"></progress>
  <div class="loading-status"><span class="loading-metrics"></span><span class="loading-elapsed"></span></div>
  <button type="button" hidden>重试加载素材</button>
</aside>
<script>
(() => {
  const panel=document.querySelector("#scene-loading");
  let recovering=false;
  window.addEventListener("error",event=>{
    if(!["sceneMeter","sceneEntry"].includes(event.target?.id) || panel.hidden || recovering) return;
    recovering=true;
    panel.dataset.moduleFailed="true";
    const url=new URL(location.href);
    const note=panel.querySelector(".loading-note");
    if(!url.searchParams.has("_scene_retry")) {
      note.textContent="连接中断，正在重新打开画卷。";
      url.searchParams.set("_scene_retry","1");
      setTimeout(()=>location.replace(url.href),750);
      return;
    }
    panel.querySelector("h2").textContent="暂时无法打开画卷";
    panel.querySelector("progress").hidden=true;
    panel.querySelector(".loading-status").hidden=true;
    note.textContent="街景程序未能下载。网络恢复后可重新加载。";
    const retry=panel.querySelector("button");
    retry.hidden=false;
    retry.addEventListener("click",event=>{
      event.stopImmediatePropagation();
      url.searchParams.delete("_scene_retry");
      location.replace(url.href);
    },{capture:true,once:true});
  },true);
})();
</script>

<div id="seal">入卷 v1.20</div>
<script id="sceneEntry" type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { bridgeAnchor, createBridgeMission } from "./bridge-mission.js";
import { canalDepth, canalHalfLength, canalOrigin } from "./bridge-canal-bed.js";
import { createStreetScene } from "./bridge-street.js";
import { createStreetTerrain } from "./bridge-street-ground.js";
import { cutDrainApron } from "./bridge-backlane.js";
import { createEarthMaterial } from "./bridge-earth.js";
import { createSurfaceLibrary, setSurfaceTextureLoader } from "./bridge-look.js";
import { loadSceneSizes, sceneAsset, sceneImage, prepareFirstFrame, showFirstFrame, failScene } from "./scene-loading.js?v=136";
import { sweepHorizontal } from "./bridge-collision.js";

const params = new URLSearchParams(location.search);
const startInMission=params.has("mission");
if(startInMission) {
  document.getElementById("scene-loading-title").textContent="正在进入桥畔茶铺";
  if(params.has("restart"))
    document.querySelector("#scene-loading .loading-note").textContent="场景就绪后会打开重置确认。";
}
const base = (params.get("scene") || "../data/seg01/scene/").replace(/\/?$/, "/");
await loadSceneSizes();
const L = await sceneAsset(base+"layout.json","front",async blob=>JSON.parse(await blob.text())).catch(error=>{
  failScene("场景清单未能下载，请检查网络后重试。");
  throw error;
});
const th = THREE.MathUtils.degToRad(L.camera.elev_deg);
const s = L.camera.m_per_px, W = L.image.width, H = L.image.height;
const GW = L.ground.width, GD = L.ground.depth;


const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
renderer.domElement.tabIndex = 0;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xEDE6D6);
function textureFromImage(image) {
  const texture=new THREE.Texture(image);
  texture.needsUpdate=true;
  return texture;
}
setSurfaceTextureLoader((url,options)=>sceneImage(url,"background",options).then(textureFromImage));
const surfaces=createSurfaceLibrary();
const textures=new Map();
function tex(file,phase,essential=false) {
  if(textures.has(file)) return textures.get(file);
  const t=new THREE.Texture();
  t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=8;
  sceneImage(base+file,phase).then(image=>{
    t.image=image;
    t.needsUpdate=true;
  },()=>{
    if(essential) failScene("地面图像未能下载，请检查网络后重试。");
  });
  textures.set(file,t);
  return t;
}

// Ground: the painting with objects removed, mapped affinely onto the ground plane.
const ground = new THREE.Mesh(new THREE.PlaneGeometry(GW, GD), new THREE.MeshBasicMaterial({ map: tex(L.ground.tex,"front",true) }));
ground.rotation.x = -Math.PI / 2; ground.position.set(0, 0, -GD / 2); scene.add(ground);
ground.receiveShadow=true;
ground.userData.archiveMaterial=ground.material;
ground.userData.archiveGeometry=ground.geometry;
const streetTerrain=createStreetTerrain(GW,GD);
const riverOrigin=canalOrigin(bridgeAnchor);
const walkingGround=createEarthMaterial(riverOrigin,url=>sceneImage(url,"background").then(textureFromImage));
ground.userData.perspectiveMaterial=walkingGround;

const apron = new THREE.Mesh(new THREE.PlaneGeometry(GW * 3, GD * 4), new THREE.MeshBasicMaterial({ color: 0xE3D9C3 }));
apron.rotation.x = -Math.PI / 2; apron.position.set(0, -0.02, -GD / 2); scene.add(apron);
const showDrainOpening=cutDrainApron(apron.material);

// Cards: fixed ones face the painting's viewer (+Z); sprites turn to face the camera about Y.
// offPainting: extras that exist only away from the painting view (cross cards, shadows), so the
// painting view still reproduces the scroll exactly.
const sprites = [], swapCards = [], models = [], offPainting = [], trailCards = [];
const SHADOWED = new Set(["person", "horse", "donkey", "ox", "cart", "sedan chair", "tree", "umbrella"]);
const shadowSpots = [];
const street=createStreetScene(scene,L.objects,bridgeAnchor,streetTerrain.userData.floorHeight);
const sourceReplacements=[];
for (const o of L.objects) {
  const canalCard = (o.y || 0)<.4 && (o.label==="person" || o.label==="umbrella") &&
    Math.abs(o.z-riverOrigin.y)<canalHalfLength &&
    canalDepth(riverOrigin,o.x,o.z)>.022;
  // The playable landing has its own ground and obstacles in mission mode.
  const onLanding=o.label==="person" && (o.y||0)<.4 &&
    o.x>bridgeAnchor.x-13 && o.x<bridgeAnchor.x-7 &&
    o.z>bridgeAnchor.z-7.15 && o.z<bridgeAnchor.z-1.45;
  const hideInMission=o.id==="o0288" || o.id==="o0400" || canalCard || onLanding ||
    (o.label==="person" && o.y>0 && Math.abs(o.z+41.422)<1.05);
  const near=Math.hypot(o.x-bridgeAnchor.x,o.z-bridgeAnchor.z)<40;
  const needed=!hideInMission && o.label!=="bridge" && !street.replacements.has(o.id);
  const phase=!startInMission || (near && needed) ? "front" : "background";
  const g = new THREE.PlaneGeometry(o.w, o.h); g.translate(0, o.h / 2, 0);
  const m=new THREE.MeshBasicMaterial({map:tex(o.tex_hd || o.tex,phase),alphaTest:.5,side:THREE.DoubleSide});
  const mesh=new THREE.Mesh(g,m);
  mesh.position.set(o.x,o.y || 0,o.z); mesh.userData=o; scene.add(mesh);
  if(hideInMission) trailCards.push(mesh);
  if(street.replacements.has(o.id)) sourceReplacements.push(mesh);
  if (o.billboard === "sprite") sprites.push(mesh);
  if (o.mesh) swapCards.push(mesh);
  if (o.label === "tree") {
    // A second card at right angles: the tree keeps its volume when seen from the side.
    const x = new THREE.Mesh(g, m); x.rotation.y = Math.PI / 2; mesh.add(x); offPainting.push(x);
  }
  if (SHADOWED.has(o.label) && !street.replacements.has(o.id)) shadowSpots.push(o);
}
// Contact shadows: one instanced soft ellipse per grounded object.
{
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const x = c.getContext("2d"), gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, "rgba(60,45,30,0.55)"); gr.addColorStop(0.6, "rgba(60,45,30,0.22)"); gr.addColorStop(1, "rgba(60,45,30,0)");
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
  const sg = new THREE.PlaneGeometry(1, 1); sg.rotateX(-Math.PI / 2);
  const sm = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false });
  const inst = new THREE.InstancedMesh(sg, sm, shadowSpots.length);
  const M = new THREE.Matrix4();
  shadowSpots.forEach((o, i) => {
    const w = o.label === "tree" ? o.w * 0.75 : o.w * 1.1, d = o.label === "tree" ? o.w * 0.6 : Math.max(0.5, o.w * 0.55);
    M.compose(new THREE.Vector3(o.x + 0.08 * o.h, (o.y || 0) + 0.015, o.z - 0.05 * o.h), new THREE.Quaternion(), new THREE.Vector3(w, 1, d));
    inst.setMatrixAt(i, M);
  });
  inst.renderOrder = -1; scene.add(inst); offPainting.push(inst);
}
// The walk view uses a local shadow map centred on the camera. The mission has its own lights.
const ambient = new THREE.HemisphereLight(0xfff6e8, 0x8c806b, 1.23);
const sun = new THREE.DirectionalLight(0xffefd9, 2.04);
const streetSunDirection = new THREE.Vector3(-.56,.91,.42).multiplyScalar(22);
sun.position.copy(streetSunDirection);
sun.castShadow=true;
Object.assign(sun.shadow.camera,{left:-17,right:17,top:15,bottom:-15,near:.5,far:58});
sun.shadow.mapSize.set(2048,2048);
sun.shadow.normalBias=.019;
sun.shadow.bias=-.00015;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
scene.add(ambient, sun, sun.target);
// Atmospheric haze for the perspective views (the scroll's own paper colour); off in the painting view.
const haze = new THREE.Fog(0xEDE6D6, 45, 260);
// 3D models (pipeline/mesh.py): drawn unlit like the cards (their texture is the painting itself).
// Loaded in the background: the card scene shows at once, each house swaps to its model on arrival.
const gltf = new GLTFLoader();
const withMesh = L.objects.filter(o => o.mesh && !street.housing.models.has(o.id));
let showModels = true, pending = withMesh.length;
const cardOf = new Map(swapCards.map(c => [c.userData.id, c]));
// The painting view always shows the cards (they reproduce the scroll pixel for pixel);
// models take over as soon as the camera leaves it.
function applyModelVisibility() {
  const bridgeCard = swapCards.find(c => c.userData.label === "bridge");
  street.bridge.visible=mode!=="mission";
  for(const card of swapCards) {
    const bridge=card===bridgeCard;
    const revised=street.replacements.has(card.userData.id);
    card.visible=(!street.root.visible || (!showModels && mode!=="mission")) &&
      !(street.root.visible && revised);
    if(bridge && street.root.visible) card.visible=false;
  }
  for (const m of models) {
    const bridge = m.userData.label === "bridge";
    const use = !(street.root.visible && bridge) && !street.replacements.has(m.userData.id) &&
      (((showModels || mode==="mission") && mode !== "paint" && mode !== "missionScroll") ||
       (mode === "missionScroll" && bridge));
    m.visible = use;
    const replacement=street.root.visible && street.replacements.has(m.userData.id);
    cardOf.get(m.userData.id).visible = !use && !replacement &&
      (!street.root.visible || (!showModels && mode!=="mission")) &&
      !(street.root.visible && bridge);
    for (const face of m.userData.finishFaces) {
      face.material = street.root.visible ? face.userData.nearbyMaterial : face.userData.archiveMaterial;
    }
  }
}
function setModels(on) {
  showModels = on;
  applyModelVisibility();
  const b = document.getElementById("bModels");
  b.hidden = !withMesh.length;
  b.setAttribute("aria-pressed", String(on));
  b.textContent = (on ? "远处房屋：3D 模型" : "远处房屋：原画裁片") + (pending ? ` · 加载中 ${withMesh.length - pending}/${withMesh.length}` : "");
}
// Queue models with the secondary textures. Downloads start after the first draw.
for(const o of withMesh) {
  sceneAsset(base+o.mesh.glb,"background",async blob=>{
    const g=await gltf.parseAsync(await blob.arrayBuffer(),new URL(base,location.href).href);
    const finishFaces = [];
    g.scene.traverse(n => {
      if (!n.isMesh) return;
      const map = n.material.map; if (map) map.colorSpace = THREE.SRGBColorSpace;
      // Faces the painting shows stay unlit (exact painted colours); synthesised roof / wall
      // faces get soft light so the building's form reads from behind and the side.
      const synth = /^(roof|wall)/.test(n.name);
      n.material = synth ? new THREE.MeshLambertMaterial({ map, side: THREE.DoubleSide })
                         : new THREE.MeshBasicMaterial({ map, side: THREE.DoubleSide });
      if(o.label==="house"){
        if(!n.geometry.attributes.normal) n.geometry.computeVertexNormals();
        n.userData.archiveMaterial=n.material;
        n.userData.nearbyMaterial=surfaces.project(/^roof/.test(n.name) ? "gray-roof-tile" : "lime-plaster",{
          map,color:map ? 0xf1e6d2 : 0xa99073,side:THREE.DoubleSide,roughness:synth ? .89 : .96,
        });
        n.castShadow=n.receiveShadow=true;
        finishFaces.push(n);
      }
    });
    g.scene.position.set(...o.mesh.pos); g.scene.userData = { ...o, finishFaces }; scene.add(g.scene); models.push(g.scene);
    if(o.label==="house" && !street.replacements.has(o.id)){
      street.registerHouse(g.scene);
      if(mode==="walk") clearWalkSpawn();
    }
  }).catch(()=>{}).finally(()=>{
    pending--;
    setModels(showModels);
  });
}

// --- cameras ---
const dir = new THREE.Vector3(0, -Math.sin(th), -Math.cos(th));
const viewH = H * s;                       // screen-space height of the painting
const paintCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 5000);
const missionCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 5000);
const persp = new THREE.PerspectiveCamera(60, 1, 0.05, 4000);
let pan = 0;                               // horizontal scroll position in metres
const minPan = -GW / 2, maxPan = GW / 2;
function paintTarget() { return new THREE.Vector3(pan, 0, -viewH / 2 / Math.sin(th)); }
function placePaintCam() {
  const a = innerWidth / innerHeight;
  paintCam.top = viewH / 2; paintCam.bottom = -viewH / 2;
  paintCam.left = -a * viewH / 2; paintCam.right = a * viewH / 2;
  const t = paintTarget();
  paintCam.position.copy(t).addScaledVector(dir, -1000);
  paintCam.up.set(0, 1, 0); paintCam.lookAt(t); paintCam.updateProjectionMatrix();
}
const orbit = new OrbitControls(persp, renderer.domElement); orbit.enabled = false;

let mode = "paint", cam = paintCam, mission;
const inMission = () => mode === "mission" || mode === "missionScroll";
function placeMissionCam() {
  const w = 37;
  const h = w * innerHeight / innerWidth;
  missionCam.left = -w / 2; missionCam.right = w / 2;
  missionCam.top = h / 2; missionCam.bottom = -h / 2;
  const aim = new THREE.Vector3(mission.anchor.x + 1.6, .25, mission.anchor.z);
  missionCam.position.copy(aim).addScaledVector(dir, -150);
  missionCam.lookAt(aim);
  missionCam.updateProjectionMatrix();
}
function setPaintingExact(on) {
  showDrainOpening(mode==="mission");
  for (const e of offPainting) e.visible = !on;
  for (const card of trailCards) card.visible = mode !== "mission";
  street.root.visible=!on;
  ground.material=on ? ground.userData.archiveMaterial : walkingGround;
  ground.geometry=on ? ground.userData.archiveGeometry : streetTerrain;
  ambient.intensity=(on ? .80 : .55)*Math.PI;
  sun.intensity=(on ? .32 : .52)*Math.PI;
  sun.position.set(-.6,on ? 1 : .72,.5);
  for (const card of sourceReplacements) card.visible=on;
  scene.fog = on ? null : haze;
  applyModelVisibility();
}
const help = {
  paint: "拖动或滚轮：展开画卷。这是原画的视角，场景在这里与原画逐像素重合；离开这个视角，房屋和桥换成 3D 模型。",
  walk: "WASD / 方向键走动，拖动鼠标转头，Shift 加速，Q/E 升降。",
  orbit: "拖动旋转，右键平移，滚轮缩放。",
  fly: "飞入中…",
};
function ensureMission() {
  if (!mission) {
    mission = createBridgeMission({ scene, camera: persp, renderer, ambient, sun, ground, apron, street, setMode,
      clearInput:()=>{keys.clear();drag=null;} });
  }
  return mission;
}
function setMode(m) {
  if (m === "mission" || m === "missionScroll") ensureMission();
  mode = m;

  for (const [id, k] of [["bPaint", "paint"], ["bWalk", "walk"], ["bOrbit", "orbit"]])
    document.getElementById(id).setAttribute("aria-pressed", String(k === m));
  document.getElementById("help").textContent = help[m] || "";
  orbit.enabled = m === "orbit";
  cam = m === "paint" ? paintCam : m === "missionScroll" ? missionCam : persp;
  setPaintingExact(m === "paint" || m === "missionScroll");
  mission?.setView(m);
  renderer.shadowMap.enabled = m === "mission" || m === "walk" || m === "fly";
  if (m === "mission") {
    persp.fov = 58; persp.updateProjectionMatrix();
    renderer.domElement.focus({ preventScroll: true });
  }
  if (m === "missionScroll") placeMissionCam();
  if (m === "paint") placePaintCam();
  if (m === "walk") clearWalkSpawn();
  if (m === "orbit") {
    persp.fov = 50; persp.updateProjectionMatrix();
    orbit.target.copy(paintTarget());
    persp.position.copy(orbit.target).add(new THREE.Vector3(0, GD * 0.6, GD * 0.9));
    orbit.update();
  }
}

// --- walk controls ---
const walk = { yaw: 0, pitch: -0.05, pos: new THREE.Vector3(0, 1.6, 2) };
const walkSupport=(x,z)=>Math.max(street.streetHeight(x,z),street.housing.workshop.support(x,z));
const walkClear=(x,z,feet)=>!street.collisions.blocking(x,z,feet,.31,1.67);
function clearWalkSpawn() {
  const {x,y,z}=walk.pos, feet=y-1.54;
  if(walkClear(x,z,feet)) return;
  for(let i=1;i<=28;i++) {
    const radius=i*.42;
    const samples=Math.max(12,i*5);
    for(let j=0;j<samples;j++) {
      const angle=2*Math.PI*j/samples;
      const px=x+Math.cos(angle)*radius, pz=z+Math.sin(angle)*radius;
      if(!walkClear(px,pz,feet)) continue;
      walk.pos.set(px,y,pz);
      return;
    }
  }
}
const keys = new Set();
addEventListener("keydown", e => keys.add(e.key.toLowerCase()));
addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());
let drag = null;
renderer.domElement.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY }; });
addEventListener("pointerup", () => drag = null);
addEventListener("pointercancel", () => drag = null);
addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag = { x: e.clientX, y: e.clientY };
  if (mode === "walk") { walk.yaw -= dx * 0.004; walk.pitch = THREE.MathUtils.clamp(walk.pitch - dy * 0.004, -1.4, 1.4); }
  if (mode === "mission") mission.turn(dx, dy);
  if (mode === "paint") { pan = THREE.MathUtils.clamp(pan - dx * viewH / innerHeight, minPan, maxPan); placePaintCam(); }
});
renderer.domElement.addEventListener("wheel", e => {
  if (mode !== "paint") return;
  e.preventDefault();
  pan = THREE.MathUtils.clamp(pan + (e.deltaY + e.deltaX) * viewH / innerHeight * 0.5, minPan, maxPan); placePaintCam();
}, { passive: false });
function applyWalk() {
  persp.position.copy(walk.pos);
  persp.quaternion.setFromEuler(new THREE.Euler(walk.pitch, walk.yaw, 0, "YXZ"));
}

// --- fly into the painting: narrow-FOV far camera (≈ the orthographic view) → street level ---
let fly = null;
function startFly() {
  const t = paintTarget();
  const f0 = 1.0, D = viewH / 2 / Math.tan(THREE.MathUtils.degToRad(f0 / 2));
  const p0 = t.clone().addScaledVector(dir, -D);
  const q0 = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().lookAt(p0, t, new THREE.Vector3(0, 1, 0)));
  walk.pos.set(pan, 1.6, -GD * 0.25); walk.yaw = 0; walk.pitch = -0.04;
  const q1 = new THREE.Quaternion().setFromEuler(new THREE.Euler(walk.pitch, walk.yaw, 0, "YXZ"));
  fly = { t0: performance.now(), dur: 6000, p0, p1: walk.pos.clone(), q0, q1, f0, f1: 60 };
  mode = "fly"; cam = persp; orbit.enabled = false; setPaintingExact(false);
  document.getElementById("help").textContent = help.fly;
}
function stepFly(now) {
  const u = Math.min(1, (now - fly.t0) / fly.dur);
  const e = u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
  // FOV in log space; position follows the dolly so the framing changes smoothly.
  const f = Math.exp(Math.log(fly.f0) * (1 - e) + Math.log(fly.f1) * e);
  persp.fov = f; persp.updateProjectionMatrix();
  const ef = Math.pow(e, 0.35);  // distance collapses early, rotation finishes late
  persp.position.lerpVectors(fly.p0, fly.p1, ef);
  persp.quaternion.slerpQuaternions(fly.q0, fly.q1, e);
  if (u >= 1) { fly = null; setMode("walk"); }
}

document.getElementById("bPaint").onclick = () => setMode("paint");
document.getElementById("bWalk").onclick = () => { walk.pos.set(pan, 1.6, -GD * 0.25); setMode("walk"); };
document.getElementById("bOrbit").onclick = () => setMode("orbit");
document.getElementById("bFly").onclick = () => startFly();
document.getElementById("bModels").onclick = () => setModels(!showModels);
document.getElementById("bMission").onclick = () => {
  setMode("mission");
  mission.openBriefing();
};
document.getElementById("bMissionRestart").onclick = event => ensureMission().requestRestart(event.currentTarget);
setModels(true);

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  persp.aspect = innerWidth / innerHeight; persp.updateProjectionMatrix();
  if (mode === "paint") placePaintCam();
  if (mode === "missionScroll") placeMissionCam();
}
addEventListener("resize", resize); resize(); setMode(startInMission ? "mission" : "paint");

let firstFrame=false, firstAssets=false;
prepareFirstFrame().then(()=>{firstAssets=true;});
const clock = new THREE.Clock();
const fwd = new THREE.Vector3(), right = new THREE.Vector3();
renderer.setAnimationLoop(now => {
  const elapsed = clock.getDelta();
  if(!firstAssets) return;

  const dt = Math.min(elapsed, 0.05);
  if (mode === "fly" && !mission?.restartOpen) stepFly(now);
  if (inMission()) {
    let remaining = Math.min(elapsed, .18);
    while (remaining > .001) {
      const step = Math.min(remaining, .035);
      mission.frame(step, keys);
      remaining -= step;
    }
  }
  if (mode === "walk" && !mission?.restartOpen) {
    const v = (keys.has("shift") ? 9 : 3) * dt;
    fwd.set(-Math.sin(walk.yaw), 0, -Math.cos(walk.yaw)); right.set(-fwd.z, 0, fwd.x);
    const forward=Number(keys.has("w")||keys.has("arrowup"))-Number(keys.has("s")||keys.has("arrowdown"));
    const lateral=Number(keys.has("d")||keys.has("arrowright"))-Number(keys.has("a")||keys.has("arrowleft"));
    const pace=v/(Math.hypot(forward,lateral)||1);
    if(forward || lateral) {
      const heightOffset=walk.pos.y-1.54-walkSupport(walk.pos.x,walk.pos.z);
      sweepHorizontal(walk.pos,(fwd.x*forward+right.x*lateral)*pace,(fwd.z*forward+right.z*lateral)*pace,
        (x,z)=>walkClear(x,z,walkSupport(x,z)+heightOffset));
      walk.pos.y=1.54+walkSupport(walk.pos.x,walk.pos.z)+heightOffset;
    }
    const shift=v*(Number(keys.has("e"))-Number(keys.has("q")));
    const pieces=Math.max(1,Math.ceil(Math.abs(shift)/.09));
    for(let i=0;i<pieces && shift;i++) {
      const ny=Math.max(.3,walk.pos.y+shift/pieces);
      if(!walkClear(walk.pos.x,walk.pos.z,ny-1.54)) break;
      walk.pos.y=ny;
    }
    applyWalk();
  }
  const camPos = cam.position;
  if(street.root.visible) street.updateTrees(cam,now*.001);
  if(street.root.visible && !mission?.restartOpen) {
    const {x,y,z}=walk.pos;
    const observer=mode==="walk" ? {x,y:y-1.54,z} : mission?.livestockVisitor();
    street.livestock.update(dt,now*.001,camPos,observer);
    street.housing.updateDetail(camPos);
    street.updateHeads(dt,now*.001,observer);
    if(mode!=="mission" && Math.hypot(camPos.x+43,camPos.z+38)<55) street.market.frame(dt,observer);
  }
  if (mode === "walk" || mode === "fly") {
    const texel=34/sun.shadow.mapSize.x;
    const ahead=sun.target.position;
    ahead.set(Math.round(camPos.x/texel)*texel,0,Math.round(camPos.z/texel)*texel);
    sun.position.copy(ahead).add(streetSunDirection);
  }
  for (const sp of sprites) sp.rotation.y = mode === "paint" || mode === "missionScroll" ? 0 :
    Math.atan2(camPos.x - sp.position.x, camPos.z - sp.position.z);
  if (mode === "mission") mission.prepare();
  renderer.render(scene, cam);
  if(!firstFrame) {
    firstFrame=true;
    showFirstFrame();
    if(startInMission && !params.has("restart")) mission.openBriefing();
    if(startInMission && params.has("restart")) {
      mission.requestRestart(document.getElementById("missionRestart"));
    }
  }
});
const counts = {};
for (const o of L.objects) counts[o.label] = (counts[o.label] || 0) + 1;
document.getElementById("status").textContent =
  `${L.objects.length} 个物体 · ` + Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k} ${v}`).join(" · ") +
  ` · 段 x=${L.x0}–${L.x1}px · 仰角 ${L.camera.elev_deg}°`;
window.__scene = { L, setMode, startFly, setModels,
  get models(){return [...models,...street.housing.models.values()];},
  renderer, scene, persp, orbit, walk, walkClear,
  housing:street.housing.inspect, foliage:street.foliage, frontages:street.streetHeight.frontages,
  livestock: street.livestock.inspect, market:street.market.inspect,
  mission: () => mission?.inspect(),
  waterSample: (x,z) => mission?.sampleWater(x,z), street:street.inspect, streetHeight:street.streetHeight };
</script>
